name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  wsl:
    # The Windows app with repositories inside WSL: git, the terminal and agent commands run in the
    # distribution through wsl.exe. GitHub's Windows runners support WSL 1.
    name: Test (Windows + WSL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: git

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test WSL support
        run: npx vitest run tests/wsl.test.ts
        env:
          GITLANE_TEST_WSL: '1'
          GITLANE_TEST_WSL_DISTRO: Ubuntu-24.04
