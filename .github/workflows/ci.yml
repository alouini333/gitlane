name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  wsl:
    # The Windows app with repositories inside WSL: git, the terminal and agent commands run in the
    # distribution through wsl.exe. GitHub's Windows runners support WSL 1.
    name: Test (Windows + WSL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: git

      # A freshly installed distribution asks to create a Unix user the first time an interactive
      # shell starts (the terminal test does). Real installations have done this already.
      - name: Finish the distribution's first-run setup
        shell: pwsh
        run: |
          wsl -d Ubuntu-24.04 -u root --exec sh -c "id -u ada >/dev/null 2>&1 || useradd -m -s /bin/bash ada"
          $key = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss |
            Where-Object { (Get-ItemProperty $_.PSPath).DistributionName -eq 'Ubuntu-24.04' }
          Get-ItemProperty $key.PSPath | Format-List
          Set-ItemProperty $key.PSPath -Name RunOOBE -Value 0 -Type DWord
          Set-ItemProperty $key.PSPath -Name DefaultUid -Value 1000 -Type DWord
          wsl --terminate Ubuntu-24.04
          wsl -d Ubuntu-24.04 --exec id

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test WSL support
        run: npx vitest run tests/wsl.test.ts
        env:
          GITLANE_TEST_WSL: '1'
          GITLANE_TEST_WSL_DISTRO: Ubuntu-24.04
