name: Release

# Trunk-based releases: run this from the Actions tab on `main`, pick the kind of release, and click
# "Run workflow". It tests main, bumps the version, moves the Unreleased changelog notes under it,
# commits and tags on main, builds installers for every platform and publishes the GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Kind of release
        type: choice
        options:
          - minor
          - major
          - patch
        default: minor

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.bump }} release
    # Releases are only cut from the trunk.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bump version and changelog
        id: version
        run: |
          version=$(npm version "${{ inputs.bump }}" --no-git-tag-version | tail -n1 | sed 's/^v//')
          node scripts/changelog.mts release "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and tag on main
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release v$version"
          git tag -a "v$version" -m "Gitlane v$version"
          git push origin HEAD:main "v$version"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Windows
            os: windows-latest
            target: --win
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates yet: build unsigned packages.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: gitlane-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  publish:
    name: Publish v${{ needs.prepare.outputs.version }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        run: |
          node scripts/changelog.mts notes "${{ needs.prepare.outputs.version }}" > notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "| System | File |"
            echo "| --- | --- |"
            echo "| macOS, Apple silicon | \`Gitlane-mac-arm64.dmg\` |"
            echo "| macOS, Intel | \`Gitlane-mac-x64.dmg\` |"
            echo "| Windows 10/11 (x64) | \`Gitlane-win-x64-setup.exe\` |"
            echo "| Linux (x64) | \`Gitlane-linux-x86_64.AppImage\` or \`Gitlane-linux-amd64.deb\` |"
            echo
            echo "Builds are not code-signed yet. See the [README](https://github.com/${{ github.repository }}#install) for how to open them."
          } >> notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          ls -la artifacts
          gh release create "v$version" artifacts/* \
            --title "Gitlane v$version" \
            --notes-file notes.md \
            --verify-tag
