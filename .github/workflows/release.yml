name: Release

# Trunk-based releases, step 1 of 2. Run this from the Actions tab on `main` and pick the kind of
# release. It tests main, bumps the version, moves the Unreleased changelog notes under it, and opens
# a "Release vX.Y.Z" pull request. Merging that PR runs publish.yml, which tags, builds and publishes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Kind of release
        type: choice
        options:
          - minor
          - major
          - patch
        default: minor

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open ${{ inputs.bump }} release PR
    # Releases are only cut from the trunk.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bump version and changelog
        id: version
        run: |
          version=$(npm version "${{ inputs.bump }}" --no-git-tag-version | tail -n1 | sed 's/^v//')
          node scripts/changelog.mts release "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push the release branch
        run: |
          version="${{ steps.version.outputs.version }}"
          branch="release/v$version"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::$branch already exists. Merge or close its pull request (and delete the branch) first."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release v$version"
          git push origin "$branch"

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          {
            echo "Merging this pull request publishes **Gitlane v$version**: the Publish release workflow tags the merge commit, builds the macOS, Windows and Linux installers, and creates the GitHub release with the notes below."
            echo
            echo "Type-check and tests passed on \`main\` in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). This PR only changes the version and the changelog."
            echo
            echo "---"
            echo
            node scripts/changelog.mts notes "$version"
          } > body.md
          if url=$(gh pr create --base main --head "release/v$version" --title "Release v$version" --body-file body.md); then
            echo "Release PR: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            # Opening PRs from Actions needs "Allow GitHub Actions to create and approve pull requests"
            # (Settings > Actions > General). Without it, link to the PR instead of failing.
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...release/v$version?expand=1"
            echo "::warning::Couldn't open the release pull request automatically. Open it here: $compare"
            {
              echo "**[Open the Release v$version pull request]($compare)**"
              echo
              cat body.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
